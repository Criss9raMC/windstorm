<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindStorm | Staff Panel</title>

    <link rel="icon" href="BCO.7108c793-6c04-402d-b014-0e9ec52ea876.png" type="image/png">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .seccion-oculta { display: none; }
        .grupo-botones { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .input-password {
            width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 149, 255, 0.2); border-radius: 8px;
            color: #ffffff; font-family: 'Inter', sans-serif; font-size: 1rem;
            text-align: center; margin-bottom: 20px; outline: none; transition: border-color 0.3s;
        }
        .input-password:focus { border-color: #0095ff; box-shadow: 0 0 10px rgba(0, 149, 255, 0.3); }
        .nota-trabajo {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(0, 149, 255, 0.15);
            border-radius: 12px; padding: 25px; text-align: left; margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); white-space: pre-line; color: #aaaaaa;
        }
        .badge-rango {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
            margin-bottom: 15px; letter-spacing: 0.05em;
        }
        .badge-build { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid #22c55e; }
        .badge-dev { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid #a855f7; }
        .badge-mod { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid #eab308; }
        .badge-test { background: rgba(6, 182, 212, 0.15); color: #06b6d4; border: 1px solid #06b6d4; } /* Estilo Cian para Testers */
        
        .error-msg { color: #ff4a4a; font-size: 0.9rem; margin-bottom: 15px; display: none; }
        .boton-regresar { background: transparent; border: none; color: #777; cursor: pointer; font-size: 0.85rem; margin-top: 20px; text-decoration: underline; }
        .boton-regresar:hover { color: #0095ff; }
        .cargando { color: #0095ff; font-style: italic; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Panel de Staff</h1>
        <p class="subtitulo">WindStorm Interno</p>
        <hr class="linea-divisoria">

        <!-- FASE 1: SELECCIÓN -->
        <div id="pantalla-roles">
            <p class="texto-principal">Selecciona tu posición en el proyecto:</p>
            <div class="grupo-botones">
                <button class="boton-accion" onclick="irAPassword('Constructor')">🔨 Constructor</button>
                <button class="boton-accion" onclick="irAPassword('Programador')">💻 Programador</button>
                <button class="boton-accion" onclick="irAPassword('Moderador')">🛡️ Moderador</button>
                <button class="boton-accion" onclick="irAPassword('Tester')">🧪 Tester</button> <!-- Botón de Testers -->
            </div>
        </div>

        <!-- FASE 2: PASSWORD -->
        <div id="pantalla-password" class="seccion-oculta">
            <p class="texto-principal">Introduce la llave de acceso para <strong id="txt-rango-bloqueado" style="color: #0095ff;"></strong>:</p>
            <input type="password" id="input-llave" class="input-password" placeholder="Pegar contraseña aquí">
            <p id="error-texto" class="error-msg">⚠️ Contraseña incorrecta.</p>
            <button class="boton-accion" onclick="verificarPassword()">Ingresar al Panel</button>
            <button class="boton-regresar" onclick="regresarARoles()">Volver</button>
        </div>

        <!-- FASE 3: PANEL DINÁMICO -->
        <div id="pantalla-panel" class="seccion-oculta">
            <div id="badge-dinamico" class="badge-rango">Rango</div>
            <h3>Bitácora de Actividades</h3>
            
            <div class="nota-trabajo">
                <p style="color: #ffffff; margin-bottom: 10px; font-weight: 600;">📋 Indicaciones en tiempo real:</p>
                <div id="contenido-dinamico" class="cargando">Conectando con la bitácora...</div>
            </div>

            <button class="boton-regresar" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        let rangoSeleccionado = "";
        
        // Contraseñas del Staff (Incluyendo la nueva de Testers)
        const contraseñas = {
            "Constructor": "A15W2S7C1",
            "Programador": "CryptWS!26",
            "Moderador": "WSx0dM2gg",
            "Tester": "WSt3St!26"
        };

        // Enlaces directos RAW para consumir las notas
        const urlsPorRol = {
            "Constructor": "https://gist.githubusercontent.com/Criss9raMC/0c511023db7d8421053e63c620978f51/raw/80fb21cab20f8fa0f853315d52990c38afa3a653/notas_constructores.txt",
            "Programador": "https://gist.githubusercontent.com/Criss9raMC/a47c70e81f8699261618b0c62ec9f574/raw/4e09670a54d1b316d4a33d780bd9c2fb48ad5fe0/notas_programadores.txt",
            "Moderador": "https://gist.githubusercontent.com/Criss9raMC/9861c7d7ee133e926b28cc918b04aca9/raw/5767b3775b1c160b8fd8ccf0138c93685bf3da5c/notas_moderadores.txt"
            "Tester": "https://gist.githubusercontent.com/Criss9raMC/02ebe9f1d1c2622beba6f898b78684a6/raw/6f1455d141cd6c0a32a395a96d4b345aafc29ff8/notas_testers.txt"
        };

        function irAPassword(rango) {
            rangoSeleccionado = rango;
            document.getElementById('pantalla-roles').style.display = 'none';
            document.getElementById('pantalla-password').style.display = 'block';
            document.getElementById('txt-rango-bloqueado').innerText = rango;
            document.getElementById('input-llave').value = "";
            document.getElementById('error-texto').style.display = 'none';
        }

        function regresarARoles() {
            document.getElementById('pantalla-password').style.display = 'none';
            document.getElementById('pantalla-roles').style.display = 'block';
        }

        function verificarPassword() {
            const contraseñaIngresada = document.getElementById('input-llave').value.trim();
            if (contraseñaIngresada === contraseñas[rangoSeleccionado]) {
                desplegarPanel();
            } else {
                document.getElementById('error-texto').style.display = 'block';
            }
        }

        function desplegarPanel() {
            document.getElementById('pantalla-password').style.display = 'none';
            document.getElementById('pantalla-panel').style.display = 'block';
            
            const badge = document.getElementById('badge-dinamico');
            badge.innerText = rangoSeleccionado;
            
            // Asignación de clases CSS visuales según el rango
            if (rangoSeleccionado === "Constructor") badge.className = "badge-rango badge-build";
            else if (rangoSeleccionado === "Programador") badge.className = "badge-rango badge-dev";
            else if (rangoSeleccionado === "Moderador") badge.className = "badge-rango badge-mod";
            else if (rangoSeleccionado === "Tester") badge.className = "badge-rango badge-test";

            const contenedorTexto = document.getElementById('contenido-dinamico');
            contenedorTexto.className = "cargando";
            contenedorTexto.innerText = "Cargando indicaciones de la ciudad...";

            // Consulta asíncrona rompiendo la caché del navegador para texto inmediato
            const urlFinal = urlsPorRol[rangoSeleccionado] + "?t=" + new Date().getTime(); 
            
            fetch(urlFinal)
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.text();
                })
                .then(texto => {
                    contenedorTexto.className = "";
                    contenedorTexto.innerText = texto;
                })
                .catch(() => {
                    contenedorTexto.className = "";
                    contenedorTexto.innerText = "❌ Error al conectar. Verifica que el enlace sea el correcto o que la nota sea pública.";
                });
        }

        function cerrarSesion() {
            document.getElementById('pantalla-panel').style.display = 'none';
            document.getElementById('pantalla-roles').style.display = 'block';
        }
    </script>
</body>
</html>
